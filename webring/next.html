<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bounce page for the IndieWeb Webring (xn--sr8hvo.ws = 🕸💍.ws).
       The ring is joined as mergedcloud.de, and its /next endpoint picks "your"
       neighbour by matching the Referer against the member URL. Links on
       blog.mergedcloud.de would send that subdomain and land on a random member,
       so the blog links point HERE instead: this page lives on mergedcloud.de and
       forwards on, sending Referer "https://mergedcloud.de/".
       "origin" forces exactly that value (no path) regardless of the browser's
       default, which is what matched in testing. Not meant for search results. -->
  <meta name="referrer" content="origin" />
  <meta name="robots" content="noindex" />
  <title>Next site · IndieWeb Webring</title>
  <link rel="icon" href="../favicon.ico" sizes="any" />
  <style>
    body { background: #0f1218; color: #c9cfd8; font: 1rem/1.5 ui-monospace, monospace; margin: 0; padding: 3rem 1rem; text-align: center; }
    a { color: #E3AC57; }
  </style>
</head>
<body>
  <!-- location.replace (not href) so this page doesn't stay in the back-button history. -->
  <script>location.replace("https://xn--sr8hvo.ws/next");</script>
  <p>Going to the <a href="https://xn--sr8hvo.ws/next">next site</a> in the IndieWeb Webring 🕸💍…</p>
</body>
</html>
