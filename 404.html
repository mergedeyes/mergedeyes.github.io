<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <title>404 — not found</title>
  <style>
    :root { --bg:#0E1116; --text:#E9EDF2; --muted:#7E8794; --accent:#E3AC57; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:1rem; padding:2rem; text-align:center;
    }
    .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:var(--accent); font-size:.85rem; }
    h1 { font-size:clamp(2.5rem,8vw,4rem); margin:0; letter-spacing:-0.02em; }
    p { color:var(--muted); margin:0; }
    a {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:var(--text); font-size:.85rem;
      text-decoration:none; border-bottom:1px solid var(--accent); padding-bottom:2px; margin-top:.5rem;
    }
  </style>
</head>
<body>
  <p class="code">error: path not found</p>
  <h1>404</h1>
  <p>This page doesn't exist.</p>
  <a href="/">cd ~/</a>
</body>
</html>
