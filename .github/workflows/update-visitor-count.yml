name: Update visitor count

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# Shared with generate-project-pages.yml's concurrency group below:
# that workflow triggers on every push this one makes (via workflow_run
# AND push:branches:[main]), so the two were racing to commit+push
# almost every single time this workflow succeeded -- confirmed in git
# history: zero successful visitor-count.json commits survived since
# the GoatCounter migration, every one lost to a non-fast-forward push
# rejection. Same group name on both workflows means GitHub queues them
# against EACH OTHER, not just against re-runs of the same workflow.
concurrency:
  group: main-branch-writes
  cancel-in-progress: false

permissions:
  contents: write  # git-auto-commit-action needs push rights

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update visitor count
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/update_visitor_count.py

      - name: Commit updated count
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update visitor count"
          file_pattern: ".github/data/visitor-count.json index.html visitors.html"
